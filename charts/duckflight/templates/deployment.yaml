{{- if not (or .Values.postgres.enabled .Values.flight.enabled) }}
{{- fail "enable at least one of postgres.enabled or flight.enabled" }}
{{- end }}
{{- if and .Values.postgres.enabled .Values.flight.enabled (eq (int .Values.postgres.port) (int .Values.flight.port)) }}
{{- fail "postgres.port and flight.port must differ when both listeners are enabled" }}
{{- end }}
{{- $auth := required "auth.existingSecret is required (TOML and TLS identity)" .Values.auth.existingSecret }}
{{- $bootstrap := required "bootstrap.existingSecret is required (lake startup SQL)" .Values.bootstrap.existingSecret }}
{{- $probePort := ternary "flight" "postgres" .Values.flight.enabled }}
{{- if .Values.idleScale.enabled }}
{{- $_ := required "idleScale.existingSecret is required (token and worker CA)" .Values.idleScale.existingSecret }}
{{- if or (eq (int .Values.idleScale.controlPort) 4090) (and .Values.postgres.enabled (eq (int .Values.idleScale.controlPort) (int .Values.postgres.port))) (and .Values.flight.enabled (eq (int .Values.idleScale.controlPort) (int .Values.flight.port))) }}
{{- fail "idleScale.controlPort must differ from enabled listeners and proxy health port 4090" }}
{{- end }}
{{- if or (and .Values.postgres.enabled (eq (int .Values.postgres.port) 4090)) (and .Values.flight.enabled (eq (int .Values.flight.port) 4090)) }}
{{- fail "idleScale listeners must differ from proxy health port 4090" }}
{{- end }}
{{- end }}
{{- range .Values.extraEnv }}
{{- if has .name (list "DUCKFLIGHT_DATABASE" "DUCKFLIGHT_CONFIG" "DUCKFLIGHT_INIT_SQL" "DUCKFLIGHT_PG_ADDRESS" "DUCKFLIGHT_FLIGHT_ADDRESS" "DUCKFLIGHT_MEMORY_LIMIT" "DUCKFLIGHT_THREADS" "DUCKFLIGHT_TEMP_DIRECTORY" "DUCKFLIGHT_IDLE_CONTROL_ADDRESS" "DUCKFLIGHT_IDLE_TOKEN_FILE" "DUCKFLIGHT_IDLE_EXPECTED_LISTENERS" "DUCKFLIGHT_IDLE_SERVER_NAME" "HOME") }}
{{- fail (printf "extraEnv must not override chart-managed variable %s" .name) }}
{{- end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "duckflight.name" . }}
  {{- if .Values.idleScale.enabled }}
  annotations:
    duckflight.sidequery.dev/idle-scale: "true"
  {{- end }}
  labels:
    {{- include "duckflight.labels" . | nindent 4 }}
spec:
  {{- if .Values.idleScale.enabled }}
  {{- $existing := lookup "apps/v1" "Deployment" .Release.Namespace (include "duckflight.name" .) }}
  {{- if and $existing (gt (int $existing.spec.replicas) 0) (ne (dig "annotations" "duckflight.sidequery.dev/idle-scale" "false" $existing.metadata) "true") }}
  {{- fail "enabling idleScale on live normal-mode workers requires draining them first; use a fresh release" }}
  {{- end }}
  {{- if and $existing (gt (int $existing.spec.replicas) 1) }}
  {{- fail "enabling idleScale on multiple live workers requires draining them first; use a fresh release" }}
  {{- end }}
  # Preserve the controller's desired count across Helm upgrades; cold installs
  # have zero workers. This mode deliberately owns exactly one awake worker.
  replicas: {{ if $existing }}{{ $existing.spec.replicas }}{{ else }}0{{ end }}
  {{- else }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "duckflight.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "duckflight.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "duckflight.serviceAccount" . }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: duckflight
          image: {{ include "duckflight.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: DUCKFLIGHT_DATABASE
              value: ":memory:"
            - name: DUCKFLIGHT_CONFIG
              value: /run/secrets/duckflight.toml
            - name: DUCKFLIGHT_INIT_SQL
              value: /run/bootstrap/init.sql
            - name: DUCKFLIGHT_PG_ADDRESS
              value: {{ ternary (printf "0.0.0.0:%v" .Values.postgres.port) "" .Values.postgres.enabled | quote }}
            - name: DUCKFLIGHT_FLIGHT_ADDRESS
              value: {{ ternary (printf "0.0.0.0:%v" .Values.flight.port) "" .Values.flight.enabled | quote }}
            - name: DUCKFLIGHT_MEMORY_LIMIT
              value: {{ .Values.duckdb.memoryLimit | quote }}
            - name: DUCKFLIGHT_THREADS
              value: {{ .Values.duckdb.threads | quote }}
            - name: DUCKFLIGHT_TEMP_DIRECTORY
              value: /data/spill
            {{- if .Values.idleScale.enabled }}
            - name: DUCKFLIGHT_IDLE_CONTROL_ADDRESS
              value: {{ printf "0.0.0.0:%v" .Values.idleScale.controlPort | quote }}
            - name: DUCKFLIGHT_IDLE_TOKEN_FILE
              value: /run/idle-secret/token
            - name: DUCKFLIGHT_IDLE_EXPECTED_LISTENERS
              value: {{ add (ternary 1 0 .Values.postgres.enabled) (ternary 1 0 .Values.flight.enabled) | quote }}
            - name: DUCKFLIGHT_IDLE_SERVER_NAME
              value: {{ include "duckflight.name" . | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            {{- if .Values.idleScale.enabled }}
            - name: idle-control
              containerPort: {{ .Values.idleScale.controlPort }}
            {{- end }}
            {{- if .Values.postgres.enabled }}
            - name: postgres
              containerPort: {{ .Values.postgres.port }}
            {{- end }}
            {{- if .Values.flight.enabled }}
            - name: flight
              containerPort: {{ .Values.flight.port }}
            {{- end }}
          # Flight starts last when both protocols are enabled. Kubernetes' native
          # gRPC probe cannot negotiate this listener's required TLS transport.
          startupProbe:
            {{- if .Values.idleScale.enabled }}
            exec:
              command: [/usr/local/bin/duckflight-idle-proxy, worker-ready]
            {{- else }}
            tcpSocket:
              port: {{ $probePort }}
            {{- end }}
            {{- toYaml .Values.startupProbe | nindent 12 }}
          readinessProbe:
            {{- if .Values.idleScale.enabled }}
            exec:
              command: [/usr/local/bin/duckflight-idle-proxy, worker-ready]
            {{- else }}
            tcpSocket:
              port: {{ $probePort }}
            {{- end }}
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.idleScale.enabled }}
            - name: idle-secret
              mountPath: /run/idle-secret
              readOnly: true
            {{- end }}
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: auth
              mountPath: /run/secrets
              readOnly: true
            - name: bootstrap
              mountPath: /run/bootstrap
              readOnly: true
      volumes:
        {{- if .Values.idleScale.enabled }}
        - name: idle-secret
          secret:
            secretName: {{ .Values.idleScale.existingSecret }}
            defaultMode: 0440
            items:
              - key: token
                path: token
              - key: ca.crt
                path: ca.crt
        {{- end }}
        - name: data
          emptyDir:
            sizeLimit: {{ .Values.spill.sizeLimit }}
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: auth
          secret:
            secretName: {{ $auth }}
            defaultMode: 0440
        - name: bootstrap
          secret:
            secretName: {{ $bootstrap }}
            defaultMode: 0440
            items:
              - key: {{ .Values.bootstrap.key }}
                path: init.sql
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
