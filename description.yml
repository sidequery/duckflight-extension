extension:
  name: duckflight
  description: Query DuckDB from PostgreSQL, Arrow Flight SQL, HTTP, and Quack clients
  version: 0.2.1
  language: Rust
  build: cargo
  license: MIT
  excluded_platforms: "wasm_mvp;wasm_eh;wasm_threads;windows_amd64;windows_amd64_rtools;windows_amd64_mingw;linux_amd64_musl"
  opt_in_platforms: "osx_amd64"
  requires_toolchains: "rust;python3"
  maintainers:
    - nicosuave

repo:
  github: sidequery/duckflight-extension
  # Replace with the public release commit before submitting upstream.
  ref: 0000000000000000000000000000000000000000

docs:
  hello_world: |
    -- Create the first administrator; the generated password is shown once.
    SELECT * FROM duckflight_init('alice');

    -- Let PostgreSQL clients query this DuckDB database.
    SELECT * FROM duckflight_serve('postgres', '127.0.0.1:5433');

    -- Let Arrow Flight SQL clients query the same database.
    SELECT * FROM duckflight_serve('flight', '127.0.0.1:31337');
  extended_description: |
    Use DuckDB as a database server. DuckFlight lets PostgreSQL, Arrow Flight SQL, HTTP, and Quack
    clients query the same live DuckDB database that loaded the extension—no export, copy, or
    second database required.

    Connect with PostgreSQL tools such as `psql`, Psycopg, JDBC, and BI applications; Arrow ADBC
    Flight SQL clients; or another DuckDB instance through the Airport extension. Reads and writes
    are immediately visible to DuckDB and every connected client.

    Listeners require authentication. Users, passwords and access tokens live in an account
    store beside the database and are managed with SQL (`CREATE USER`, `CREATE TOKEN`), each
    with the role `reader`, `writer` or `admin`. An optional `duckflight.toml` adds TLS, OIDC
    and other listener settings. See the
    [quickstart](https://github.com/sidequery/duckflight-extension/blob/main/README.md#quickstart).

    HTTP returns Arrow IPC; Quack serves DuckDB's binary protocol at `/quack`.
    Both accept tokens, OIDC, or mTLS rather than PostgreSQL SCRAM users.

    Server-control functions:

    | Function | Purpose |
    | --- | --- |
    | `duckflight_serve(protocol, address, config_file := '')` | Starts an authenticated listener for `postgres`, `flight`, `http` or `quack`; returns its protocol and bound address. |
    | `duckflight_stop(protocol, address)` | Stops the specified listener and returns its status. |
    | `duckflight_servers()` | Lists running listeners and their bound addresses. |
    | `duckflight_core_status()` | Reports whether the runtime loaded, its ABI version, and status details. |
    | `duckflight_init(admin)` | Creates the account store's first administrator; returns the user and password. |
    | `duckflight_user_add(name, role := 'reader')` | Adds a user; returns the user and password. |
    | `duckflight_token_add(user, token_name)` | Adds a bearer token for a user; returns the token once. |
    | `duckflight_accounts()` | Lists users, their roles and their credentials. |
    | `duckflight_import(config_file)` | Moves users and tokens from an older `duckflight.toml` into the store. |

    The automatically detected functions below also include PostgreSQL compatibility macros
    and internal session/catalog helpers installed by the runtime. These support PostgreSQL
    queries and client metadata discovery; they are not additional server controls or a complete
    implementation of PostgreSQL functions. Their catalog comments describe each helper.
    The v1 table-function C API does not expose function-description setters,
    so the native server and account functions are documented above.
