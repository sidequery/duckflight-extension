apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      fixture: postgres
  template:
    metadata:
      labels:
        fixture: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
          env:
            - name: POSTGRES_DB
              value: ducklake_catalog
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: test-credentials
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, postgres, -d, ducklake_catalog]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    fixture: postgres
  ports:
    - port: 5432
      targetPort: 5432
