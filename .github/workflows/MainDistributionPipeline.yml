# DuckDB's official build, test, packaging, and distribution matrix.
name: Main Extension Distribution Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    # v1.5-variegata, pinned to the same reviewed revision as the submodule.
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@a285602bf745d6ceaa704b5df47f08b00ca296ae
    with:
      duckdb_version: v1.5.5
      ci_tools_version: a285602bf745d6ceaa704b5df47f08b00ca296ae
      extension_name: duckflight
      extra_toolchains: rust;python3
      exclude_archs: "wasm_mvp;wasm_eh;wasm_threads;windows_amd64;windows_amd64_rtools;windows_amd64_mingw;linux_amd64_musl"
