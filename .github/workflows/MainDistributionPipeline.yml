# DuckDB's official build, test, packaging, and distribution matrix.
name: Main Extension Distribution Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    # Pinned to the same revision as the submodule.
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@fe955ed3a046b0324cac2c691e73d8d776a7d5cc
    with:
      duckdb_version: v2.0.0-alpha44357
      duckdb_commit: d54cbbe3df17e8e5ce68312f483b4155836112aa
      ci_tools_version: fe955ed3a046b0324cac2c691e73d8d776a7d5cc
      extension_name: duckflight
      extra_toolchains: rust;python3
      exclude_archs: "wasm_mvp;wasm_eh;wasm_threads;windows_amd64;windows_amd64_rtools;windows_amd64_mingw;linux_amd64_musl"
      opt_in_archs: osx_amd64
      reduced_ci_mode: disabled
