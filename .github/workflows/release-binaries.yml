name: Release binaries

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux_amd64
            runner: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64:latest
            cli_platform: linux-amd64
            library: libduckflight.so
          - platform: linux_arm64
            runner: ubuntu-24.04-arm
            container: quay.io/pypa/manylinux_2_28_aarch64:latest
            cli_platform: linux-arm64
            library: libduckflight.so
          - platform: osx_amd64
            runner: macos-15-intel
            cli_platform: osx-amd64
            library: libduckflight.dylib
          - platform: osx_arm64
            runner: macos-15
            cli_platform: osx-arm64
            library: libduckflight.dylib
    env:
      CARGO_BUILD_JOBS: 2
      DUCKDB_PLATFORM: ${{ matrix.platform }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      DUCKFLIGHT_DISABLE_EXTENSIONS: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: true
          persist-credentials: false
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          dnf install -y clang clang-devel gcc gcc-c++ git openssl make tar gzip curl
          # The container runs as root over a checkout owned by the runner user, which git
          # refuses to read. The documentation tests list files with git.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # Rust 1.98 includes the Mach-O string table alignment fix (rust-lang/rust#158410).
          toolchain: "1.98.1"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: false
      # Release builds deliberately do not restore or save compiler caches.
      - name: Build bundled extension
        shell: bash
        env:
          LIBRARY: ${{ matrix.library }}
        run: |
          set -euo pipefail
          export DUCKFLIGHT_CORE_BUNDLE_PATH
          DUCKFLIGHT_CORE_BUNDLE_PATH="$(bash scripts/fetch-core-release.sh)"
          export DUCKDB_EXTENSION_NAME=duckflight
          export DUCKDB_EXTENSION_MIN_DUCKDB_VERSION=v1.5.6
          export RUSTFLAGS="--remap-path-prefix=$HOME=/build/home --remap-path-prefix=$PWD=/src/duckflight-extension"
          cargo build --release --locked
          mkdir -p dist
          version="$(uv run --python 3.12 --no-project python -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')"
          uv run --python 3.12 --no-project python extension-ci-tools/scripts/append_extension_metadata.py \
            -l "target/release/$LIBRARY" -o dist/duckflight.duckdb_extension \
            -n duckflight -dv v1.5.6 -ev "$version" -p "$DUCKDB_PLATFORM"
      - name: Test release and live protocols on each supported DuckDB
        shell: bash
        env:
          CLI_PLATFORM: ${{ matrix.cli_platform }}
        run: |
          set -euo pipefail
          extension=dist/duckflight.duckdb_extension
          # DuckDB release and the source ID its CLI reports.
          for host in v2.0.0:d54cbbe3df v2.0.1:8d78114e90; do
            release="${host%%:*}"
            source_id="${host##*:}"
            cli="build/release-host/$release/duckdb"
            mkdir -p "build/release-host/$release"
            curl --fail --location --retry 3 \
              "https://github.com/duckdb/duckdb/releases/download/$release/duckdb-cli-$CLI_PLATFORM.tar.gz" \
              -o "build/release-host/$release/cli.tar.gz"
            tar -xzf "build/release-host/$release/cli.tar.gz" -C "build/release-host/$release"
            "$cli" -version
            uv run --python 3.12 test/release/cli_smoke.py "$cli" "$extension" --expected-source-id "$source_id"
            uv run --python 3.12 test/release/pgwire_attached_database.py "$cli" "$extension"
            uv run --python 3.12 test/release/pgwire_cross_catalog.py "$cli" "$extension"
            uv run --python 3.12 test/release/http_quack_smoke.py "$cli" "$extension"
            uv run --python 3.12 test/release/quack_client.py "$cli" "$extension"
            uv run --python 3.12 test/release/host_only_functions.py "$cli" "$extension"
            uv run --python 3.12 test/release/setup_functions.py "$cli" "$extension"
            uv run --python 3.12 test/release/host_sessions.py "$extension" --duckdb-cli "$cli"
            uv run --python 3.12 test/release/oidc_health.py "$extension" --duckdb-cli "$cli"
            uv run --python 3.12 test/docs_snippets.py "$cli" "$extension" --skip-missing-tools
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: duckflight-release-${{ matrix.platform }}
          path: dist/duckflight.duckdb_extension
          if-no-files-found: error
